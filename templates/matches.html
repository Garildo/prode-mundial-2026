<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <link rel="manifest" href="/static/manifest.json"/>
  <meta name="theme-color" content="#0f172a"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Prode 2026"/>
  <link rel="apple-touch-icon" href="/static/icon-512.svg"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Partidos - Prode 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0f172a; background-image: radial-gradient(ellipse at 50% 110%, rgba(22,163,74,.15) 0%, transparent 60%); color: #e2e8f0; font-family: system-ui, sans-serif; margin: 0; }
    .match-card { background: #1e293b; border-radius: 14px; padding: 16px; margin-bottom: 8px; border: 1px solid #334155; transition: all .2s; }
    .match-card.clickable { cursor: pointer; }
    .match-card.clickable:hover { border-color: #22c55e; background: #243447; }
    .stage-header { color: #f59e0b; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin: 20px 0 10px; padding: 6px 12px; background: #1a1f2e; border-left: 3px solid #f59e0b; border-radius: 0 6px 6px 0; display: flex; align-items: center; gap: 8px; }
    .flag-img { width: 28px; height: 19px; border-radius: 3px; object-fit: cover; box-shadow: 0 1px 4px rgba(0,0,0,.5); flex-shrink: 0; }
    .status-live { background: #dc2626; color: white; border-radius: 4px; padding: 2px 7px; font-size: 11px; font-weight: 700; }
    .status-finished { color: #64748b; font-size: 12px; }
    .status-scheduled { color: #3b82f6; font-size: 12px; }
    .btn-sync { background: #1e3a5f; border: 1px solid #3b82f6; color: #93c5fd; border-radius: 10px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-sync:disabled { opacity: .5; cursor: not-allowed; }
    .filter-btn { padding: 8px 16px; border-radius: 20px; border: 1px solid #334155; background: transparent; color: #94a3b8; font-size: 13px; font-weight: 600; cursor: pointer; }
    .filter-btn.active { background: #16a34a; border-color: #16a34a; color: white; }
  </style>
</head>
<body>
  <!-- Header -->
  <div style="background:#1e293b; padding:14px 20px; display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:10; border-bottom:1px solid #334155;">
    <button onclick="window.location.href='/app'" style="background:transparent; border:none; color:#94a3b8; cursor:pointer; font-size:22px; padding:0;">‹</button>
    <span style="font-weight:700; font-size:17px; flex:1;">⚽ Todos los Partidos</span>
    <button class="btn-sync" id="btn-sync" onclick="syncMatches()">🔄 Sync</button>
  </div>

  <div style="padding:16px 20px; max-width:500px; margin:0 auto;">
    <!-- Filters: estado -->
    <div style="display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none;">
      <button class="filter-btn status-btn active" onclick="setFilter('all', this)">Todos</button>
      <button class="filter-btn status-btn" onclick="setFilter('SCHEDULED', this)">Próximos</button>
      <button class="filter-btn status-btn" onclick="setFilter('LIVE', this)">En vivo</button>
      <button class="filter-btn status-btn" onclick="setFilter('FINISHED', this)">Finalizados</button>
    </div>
    <!-- Filters: día -->
    <div id="day-filter-row" style="display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:4px; scrollbar-width:none;">
      <button class="filter-btn day-btn active" onclick="setDay(null, this)">Todas las fechas</button>
    </div>

    <div id="sync-msg" style="display:none; font-size:13px; color:#22c55e; margin:8px 0; text-align:center;"></div>
    <div id="matches-container">
      <div style="text-align:center; padding:40px; color:#64748b;">Cargando partidos...</div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('prode_token');
    if (!token) window.location.href = '/';

    let allMatches = [];
    let activeFilter = 'all';
    let activeDay = null;

    async function api(url, opts = {}) {
      const r = await fetch(url, {
        ...opts,
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...(opts.headers || {}) }
      });
      if (r.status === 401) { window.location.href = '/'; return null; }
      return r;
    }

    function fmtDate(iso) {
      if (!iso) return '';
      const d = new Date(iso + (iso.endsWith('Z') ? '' : 'Z'));
      return d.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit', timeZone:'America/Argentina/Buenos_Aires'}) + 'hs';
    }

    function getArgDate(iso) {
      if (!iso) return '';
      const d = new Date(iso + (iso.endsWith('Z') ? '' : 'Z'));
      return d.toLocaleDateString('en-CA', {timeZone:'America/Argentina/Buenos_Aires'});
    }

    function fmtDayHeader(dateKey) {
      const [y, m, day] = dateKey.split('-').map(Number);
      return new Date(y, m - 1, day, 12).toLocaleDateString('es-AR', {weekday:'long', day:'numeric', month:'long'});
    }

    function fmtDayBtn(dateKey) {
      const [y, m, day] = dateKey.split('-').map(Number);
      return new Date(y, m - 1, day, 12).toLocaleDateString('es-AR', {day:'numeric', month:'short'});
    }

    function fmtStage(s) {
      if (s.startsWith('GRUPO_')) return 'Grupo ' + s.replace('GRUPO_','');
      const map = {OCTAVOS:'Octavos de Final',CUARTOS:'Cuartos de Final',SEMIFINAL:'Semifinales',TERCER_PUESTO:'Tercer Puesto',FINAL:'Final',GRUPOS:'Fase de Grupos'};
      return map[s] || s;
    }

    function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function buildDayButtons() {
      const days = [...new Set(allMatches.map(m => getArgDate(m.match_date)))].sort();
      const row = document.getElementById('day-filter-row');
      const allBtn = `<button class="filter-btn day-btn active" onclick="setDay(null, this)">Todas las fechas</button>`;
      const dayBtns = days.map(d => `<button class="filter-btn day-btn" onclick="setDay('${d}', this)">${escHtml(fmtDayBtn(d))}</button>`).join('');
      row.innerHTML = allBtn + dayBtns;
    }

    function setFilter(f, btn) {
      activeFilter = f;
      document.querySelectorAll('.status-btn').forEach(b => b.className = 'filter-btn status-btn');
      btn.className = 'filter-btn status-btn active';
      renderMatches();
    }

    function setDay(d, btn) {
      activeDay = d;
      document.querySelectorAll('.day-btn').forEach(b => b.className = 'filter-btn day-btn');
      btn.className = 'filter-btn day-btn active';
      renderMatches();
    }

    function renderMatches() {
      let filtered = activeFilter === 'all' ? allMatches : allMatches.filter(m => m.status === activeFilter);
      if (activeDay !== null) filtered = filtered.filter(m => getArgDate(m.match_date) === activeDay);
      const container = document.getElementById('matches-container');

      if (!filtered.length) {
        container.innerHTML = `<div style="text-align:center; padding:40px; color:#64748b;">
          <div style="font-size:36px; margin-bottom:8px;">⏳</div>
          <p>${activeFilter === 'all' && activeDay === null ? 'No hay partidos cargados.<br>Usá el botón Sync para sincronizar.' : 'No hay partidos en esta categoría.'}</p>
        </div>`;
        return;
      }

      // Agrupar por día (hora Argentina) y ordenar por hora dentro del día
      const byDay = {};
      const dayOrder = [];
      filtered.forEach(m => {
        const day = getArgDate(m.match_date);
        if (!byDay[day]) { byDay[day] = []; dayOrder.push(day); }
        byDay[day].push(m);
      });
      Object.values(byDay).forEach(ms => ms.sort((a, b) => new Date(a.match_date) - new Date(b.match_date)));

      let html = '';
      dayOrder.forEach(day => {
        html += `<div class="stage-header">📅 ${fmtDayHeader(day)}</div>`;
        byDay[day].forEach(m => {
          const isScheduled = m.status === 'SCHEDULED';
          const isLive = m.status === 'LIVE';
          const isFinished = m.status === 'FINISHED';
          const statusBadge = isLive
            ? '<span class="status-live">● EN VIVO</span>'
            : isFinished
            ? '<span class="status-finished">Final</span>'
            : '<span class="status-scheduled">Próximo</span>';

          const score = isFinished
            ? `<span style="font-size:18px; font-weight:800; color:#f1f5f9;">${m.home_score} - ${m.away_score}</span>`
            : isLive
            ? `<span style="font-size:18px; font-weight:800; color:#dc2626;">${m.home_score ?? 0} - ${m.away_score ?? 0}</span>`
            : '<span style="color:#475569; font-size:12px; font-weight:600;">vs</span>';

          const hFlag = m.home_flag ? `<img src="https://flagcdn.com/w56/${m.home_flag}.png" alt="${escHtml(m.home_team)}" class="flag-img" onerror="this.style.display='none'">` : '';
          const aFlag = m.away_flag ? `<img src="https://flagcdn.com/w56/${m.away_flag}.png" alt="${escHtml(m.away_team)}" class="flag-img" onerror="this.style.display='none'">` : '';

          html += `<div class="match-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
              <div>
                <div style="font-size:11px; color:#64748b; text-transform:uppercase; letter-spacing:.5px;">${escHtml(fmtStage(m.stage))}</div>
                <div style="font-size:12px; color:#94a3b8;">${fmtDate(m.match_date)}</div>
              </div>
              ${statusBadge}
            </div>
            <div style="display:flex; align-items:center; justify-content:space-between; gap:6px;">
              <div style="display:flex; align-items:center; gap:8px; flex:1; min-width:0;">
                ${hFlag}
                <span style="font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escHtml(m.home_team)}</span>
              </div>
              <div style="padding:0 8px; min-width:56px; text-align:center; flex-shrink:0;">${score}</div>
              <div style="display:flex; align-items:center; gap:8px; flex:1; justify-content:flex-end; min-width:0;">
                <span style="font-weight:700; font-size:14px; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escHtml(m.away_team)}</span>
                ${aFlag}
              </div>
            </div>
          </div>`;
        });
      });

      container.innerHTML = html;
    }

    async function loadMatches() {
      const r = await api('/api/matches');
      if (!r) return;
      allMatches = await r.json();
      buildDayButtons();
      renderMatches();
    }

    async function syncMatches() {
      const btn = document.getElementById('btn-sync');
      btn.disabled = true; btn.textContent = '⏳ Sync...';
      document.getElementById('sync-msg').style.display = 'none';
      const r = await api('/api/matches/sync', { method: 'POST' });
      if (!r) { btn.disabled = false; btn.textContent = '🔄 Sync'; return; }
      const data = await r.json();
      const msg = document.getElementById('sync-msg');
      if (data.error) {
        msg.textContent = '⚠️ ' + data.error;
        msg.style.color = '#f59e0b';
      } else {
        msg.textContent = `✅ ${data.synced} partidos sincronizados`;
        msg.style.color = '#22c55e';
      }
      msg.style.display = 'block';
      btn.disabled = false; btn.textContent = '🔄 Sync';
      await loadMatches();
    }

    loadMatches();
  </script>
</body>
</html>
