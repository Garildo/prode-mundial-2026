<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <link rel="manifest" href="/static/manifest.json"/>
  <meta name="theme-color" content="#0f172a"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Prode 2026"/>
  <link rel="apple-touch-icon" href="/static/copa-mundial.png"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Grupo - Prode 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0f172a; background-image: radial-gradient(ellipse at 50% 110%, rgba(22,163,74,.15) 0%, transparent 60%); color: #e2e8f0; font-family: system-ui, sans-serif; margin: 0; }
    .tab-btn { flex: 1; padding: 10px; border-radius: 8px; border: none; background: transparent; color: #94a3b8; font-weight: 600; cursor: pointer; font-size: 15px; }
    .tab-btn.active { background: #16a34a; color: white; }
    .match-card { background: #1e293b; border-radius: 14px; padding: 16px; margin-bottom: 10px; border: 1px solid #334155; transition: border-color .2s; }
    .stage-header { color: #f59e0b; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin: 20px 0 10px; padding: 6px 12px; background: #1a1f2e; border-left: 3px solid #f59e0b; border-radius: 0 6px 6px 0; }
    .flag-img { width: 28px; height: 19px; border-radius: 3px; object-fit: cover; box-shadow: 0 1px 4px rgba(0,0,0,.5); flex-shrink: 0; }
    .pred-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .pred-home { background: #1e3a5f; color: #93c5fd; }
    .pred-away { background: #3d1a1a; color: #fca5a5; }
    .pred-draw { background: #2d2d0f; color: #fef08a; }
    .pred-correct { background: #14532d; color: #86efac; }
    .pred-wrong { background: #450a0a; color: #fca5a5; }
    .no-pred { background: #1e293b; border: 1px dashed #475569; color: #64748b; }
    .rank-row { background: #1e293b; border-radius: 12px; padding: 14px 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 14px; }
    .rank-pos { font-size: 20px; font-weight: 800; width: 32px; text-align: center; }
    .pos-1 { color: #f59e0b; } .pos-2 { color: #94a3b8; } .pos-3 { color: #b45309; }
    .share-code { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 10px 16px; font-family: monospace; font-size: 22px; letter-spacing: 6px; text-align: center; color: #22c55e; font-weight: 700; cursor: pointer; }
    .status-live { background: #dc2626; color: white; border-radius: 4px; padding: 2px 6px; font-size: 11px; font-weight: 700; }
    .status-finished { color: #64748b; font-size: 12px; }
    .filter-btn { padding: 7px 15px; border-radius: 20px; border: 1px solid #334155; background: transparent; color: #94a3b8; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .filter-btn.active { background: #16a34a; border-color: #16a34a; color: white; }
    /* Toast */
    .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #16a34a; color: white; padding: 10px 20px; border-radius: 10px; font-weight: 600; z-index: 200; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; }
    /* Barra de confirmación flotante */
    .confirm-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 20px 20px; background: linear-gradient(transparent, #0a0f1e 35%); z-index: 50; display: none; }
    /* Inputs de score */
    input[type=number] { -moz-appearance: textfield; }
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    /* Botones modal badge */
    .pred-btn-home { border-color: #3b82f6; background: #1e3a5f; color: #93c5fd; }
    .pred-btn-draw { border-color: #eab308; background: #2d2d0f; color: #fef08a; }
    .pred-btn-away { border-color: #ef4444; background: #3d1a1a; color: #fca5a5; }
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>

  <!-- Modal confirmación -->
  <div id="confirm-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:150; overflow-y:auto; padding:20px; align-items:flex-start; justify-content:center;">
    <div style="background:#1e293b; border-radius:16px; max-width:460px; width:100%; margin:0 auto; padding:24px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <div>
          <div style="font-weight:700; font-size:17px;">Confirmar pronósticos</div>
          <div style="font-size:13px; color:#64748b; margin-top:2px;"><span id="modal-count">0</span> selección(es) pendiente(s)</div>
        </div>
        <button onclick="closeConfirmModal()" style="background:transparent; border:none; color:#64748b; font-size:22px; cursor:pointer; padding:4px;">✕</button>
      </div>

      <div id="modal-list" style="max-height:50vh; overflow-y:auto; margin-bottom:20px;"></div>

      <button id="btn-confirm-all" onclick="confirmAll()" style="width:100%; background:#16a34a; color:white; border:none; border-radius:12px; padding:14px; font-size:16px; font-weight:700; cursor:pointer; margin-bottom:10px; transition:background .2s;">
        Guardar pronósticos
      </button>
      <button onclick="closeConfirmModal()" style="width:100%; background:transparent; color:#94a3b8; border:1px solid #334155; border-radius:12px; padding:12px; font-size:14px; font-weight:600; cursor:pointer;">
        Seguir eligiendo
      </button>
    </div>
  </div>

  <!-- Barra flotante -->
  <div class="confirm-bar" id="confirm-bar">
    <button onclick="openConfirmModal()" style="width:100%; max-width:500px; display:block; margin:0 auto; background:#16a34a; color:white; border:none; border-radius:14px; padding:15px; font-size:16px; font-weight:700; cursor:pointer; box-shadow:0 4px 20px rgba(0,0,0,.5);">
      Confirmar <span id="confirm-count">0</span> pronóstico(s) →
    </button>
  </div>

  <!-- Header -->
  <div style="background:#1e293b; padding:14px 20px; display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:10; border-bottom:1px solid #334155;">
    <button onclick="window.location.href='/app'" style="background:transparent; border:none; color:#94a3b8; cursor:pointer; font-size:22px; padding:0; line-height:1;">‹</button>
    <div style="flex:1;">
      <div id="group-name" style="font-weight:700; font-size:17px;">Cargando...</div>
      <div id="group-members-count" style="font-size:13px; color:#64748b;"></div>
    </div>
    <button onclick="shareGroup()" style="background:#1e3a5f; border:none; color:#93c5fd; border-radius:8px; padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer;">Invitar 🔗</button>
  </div>

  <div style="padding:20px; max-width:500px; margin:0 auto; padding-bottom:100px;">
    <!-- Invite code -->
    <div style="margin-bottom:20px;">
      <div style="font-size:13px; color:#64748b; margin-bottom:6px; text-align:center;">Código de invitación</div>
      <div class="share-code" id="invite-code-display" onclick="copyCode()">------</div>
      <div style="font-size:12px; color:#64748b; text-align:center; margin-top:6px;">Toca para copiar</div>
    </div>

    <!-- Tabs -->
    <div style="display:flex; background:#0f172a; border-radius:10px; padding:4px; margin-bottom:20px;">
      <button class="tab-btn active" id="tab-matches" onclick="switchTab('matches')">Partidos</button>
      <button class="tab-btn" id="tab-ranking" onclick="switchTab('ranking')">Ranking</button>
    </div>

    <div id="content-matches">
      <!-- Filtro por día -->
      <div id="day-filter-row" style="display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; margin-bottom:4px; scrollbar-width:none;">
        <button class="filter-btn day-btn active" onclick="setDay(null, this)">Todas</button>
      </div>

      <!-- Leyenda de puntos -->
      <div style="display:flex; gap:8px; margin-bottom:12px; padding:10px 12px; background:#1e293b; border-radius:10px; border:1px solid #334155;">
        <div style="font-size:11px; color:#64748b; flex:1;">
          <span style="color:#86efac; font-weight:700;">✓ Resultado</span> = 3pts &nbsp;·&nbsp;
          <span style="color:#fbbf24; font-weight:700;">⭐ Score exacto</span> = +2pts
        </div>
      </div>

      <div id="matches-list">
        <div style="text-align:center; padding:40px; color:#64748b;">Cargando partidos...</div>
      </div>
    </div>

    <div id="content-ranking" style="display:none;">
      <div id="ranking-list">
        <div style="text-align:center; padding:40px; color:#64748b;">Cargando ranking...</div>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('prode_token');
    const user = JSON.parse(localStorage.getItem('prode_user') || '{}');
    if (!token) window.location.href = '/';

    const groupId = parseInt(window.location.pathname.split('/').pop());
    const STORAGE_KEY = `prode_pending_g${groupId}`;

    let inviteCode = '';
    let groupMatches = [];
    let myPredictions = {};
    let groupPredictions = {};
    let pendingPredictions = {};  // { matchId: {h, a} }
    let activeDay = null;

    // Cargar pendientes del localStorage (solo formato nuevo {h, a})
    try {
      const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      Object.entries(raw).forEach(([k, v]) => {
        if (v && typeof v === 'object' && 'h' in v && 'a' in v) {
          pendingPredictions[parseInt(k)] = v;
        }
      });
    } catch (_) {}

    function getArgDate(iso) {
      if (!iso) return '';
      const d = new Date(iso + (iso.endsWith('Z') ? '' : 'Z'));
      return d.toLocaleDateString('en-CA', {timeZone:'America/Argentina/Buenos_Aires'});
    }

    function fmtDayHeader(dateKey) {
      const [y, m, day] = dateKey.split('-').map(Number);
      return new Date(y, m - 1, day, 12).toLocaleDateString('es-AR', {weekday:'long', day:'numeric', month:'long'});
    }

    function fmtDayBtn(dateKey) {
      const [y, m, day] = dateKey.split('-').map(Number);
      return new Date(y, m - 1, day, 12).toLocaleDateString('es-AR', {day:'numeric', month:'short'});
    }

    function buildDayButtons() {
      const days = [...new Set(groupMatches.map(m => getArgDate(m.match_date)))].sort();
      const today = new Date().toLocaleDateString('en-CA', {timeZone:'America/Argentina/Buenos_Aires'});
      const hasToday = days.includes(today);
      const row = document.getElementById('day-filter-row');
      const allBtn = `<button class="filter-btn day-btn" onclick="setDay(null, this)">Todas</button>`;
      const todayBtn = hasToday ? `<button class="filter-btn day-btn" onclick="setDay('${today}', this)" id="btn-hoy">Hoy</button>` : '';
      const dayBtns = days.map(d => `<button class="filter-btn day-btn" onclick="setDay('${d}', this)">${escHtml(fmtDayBtn(d))}</button>`).join('');
      row.innerHTML = allBtn + todayBtn + dayBtns;

      // Auto-seleccionar Hoy si hay partidos hoy
      if (hasToday) {
        const btnHoy = document.getElementById('btn-hoy');
        setDay(today, btnHoy);
      }
    }

    function setDay(d, btn) {
      activeDay = d;
      document.querySelectorAll('.day-btn').forEach(b => b.className = 'filter-btn day-btn');
      btn.className = 'filter-btn day-btn active';
      renderMatches();
    }

    async function api(url, opts = {}) {
      const r = await fetch(url, {
        ...opts,
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...(opts.headers || {}) }
      });
      if (r.status === 401) { window.location.href = '/'; return null; }
      return r;
    }

    function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function fmtDate(iso) {
      if (!iso) return '';
      const d = new Date(iso + (iso.endsWith('Z') ? '' : 'Z'));
      return d.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit', timeZone:'America/Argentina/Buenos_Aires'}) + 'hs';
    }

    function fmtStage(s) {
      if (s.startsWith('GRUPO_')) return 'Grupo ' + s.replace('GRUPO_','');
      const map = {
        RONDA_32:'Ronda de 32', LAST_32:'Ronda de 32', ROUND_OF_32:'Ronda de 32',
        OCTAVOS:'Octavos de Final', LAST_16:'Octavos de Final', ROUND_OF_16:'Octavos de Final',
        CUARTOS:'Cuartos de Final', QUARTER_FINALS:'Cuartos de Final',
        SEMIFINAL:'Semifinales', SEMI_FINALS:'Semifinales',
        TERCER_PUESTO:'Tercer Puesto', THIRD_PLACE:'Tercer Puesto',
        FINAL:'Final', GRUPOS:'Fase de Grupos',
      };
      return map[s] || s;
    }

    function predLabel(pred, homeTeam, awayTeam) {
      if (!pred) return '';
      if (pred === 'HOME') return homeTeam + ' gana';
      if (pred === 'AWAY') return awayTeam + ' gana';
      return 'Empate';
    }

    function predClass(pred, isCorrect) {
      if (isCorrect === true) return 'pred-correct';
      if (isCorrect === false) return 'pred-wrong';
      if (pred === 'HOME') return 'pred-home';
      if (pred === 'AWAY') return 'pred-away';
      if (pred === 'DRAW') return 'pred-draw';
      return 'no-pred';
    }

    function buildPredBadge(pred, homeTeam, awayTeam) {
      if (!pred) return `<span class="pred-badge no-pred">No pronosticaste</span>`;
      if (pred.predicted_home !== null && pred.predicted_home !== undefined) {
        let cls, suffix = '';
        if (pred.is_exact === true) { cls = 'pred-correct'; suffix = ' ⭐'; }
        else if (pred.is_correct === true) cls = 'pred-correct';
        else if (pred.is_correct === false) cls = 'pred-wrong';
        else cls = pred.prediction === 'HOME' ? 'pred-home' : pred.prediction === 'AWAY' ? 'pred-away' : 'pred-draw';
        return `<span class="pred-badge ${cls}">${pred.predicted_home}-${pred.predicted_away}${suffix}</span>`;
      }
      // Sistema viejo
      const label = predLabel(pred.prediction, homeTeam, awayTeam);
      const cls = predClass(pred.prediction, pred.is_correct);
      return `<span class="pred-badge ${cls}">${escHtml(label)}</span>`;
    }

    function savePendingToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(pendingPredictions));
    }

    function updateConfirmBar() {
      const count = Object.keys(pendingPredictions).length;
      document.getElementById('confirm-bar').style.display = count > 0 ? 'block' : 'none';
      document.getElementById('confirm-count').textContent = count;
    }

    function updateScore(matchId) {
      const hInput = document.getElementById(`home-${matchId}`);
      const aInput = document.getElementById(`away-${matchId}`);
      if (!hInput || !aInput) return;
      const h = hInput.value;
      const a = aInput.value;

      const saved = myPredictions[matchId];

      if (h !== '' || a !== '') {
        const hi = parseInt(h || '0'), ai = parseInt(a || '0');
        if (saved?.predicted_home === hi && saved?.predicted_away === ai) {
          delete pendingPredictions[matchId];
        } else {
          pendingPredictions[matchId] = {h: hi, a: ai};
        }
      } else {
        delete pendingPredictions[matchId];
      }

      savePendingToStorage();
      updateConfirmBar();
      updateScoreInputBorder(matchId);
      updateSaveBtn(matchId);
    }

    function updateSaveBtn(matchId) {
      const btn = document.getElementById(`save-btn-${matchId}`);
      if (!btn) return;
      const pending = pendingPredictions[matchId];
      if (pending !== undefined) {
        btn.style.display = 'block';
        btn.style.opacity = '1';
      } else {
        btn.style.display = 'none';
      }
    }

    async function saveOne(matchId) {
      const scoreObj = pendingPredictions[matchId];
      if (!scoreObj) return;

      const btn = document.getElementById(`save-btn-${matchId}`);
      if (btn) { btn.disabled = true; btn.textContent = 'Guardando...'; }

      const r = await api('/api/predictions/batch', {
        method: 'POST',
        body: JSON.stringify({ group_id: groupId, predictions: [{ match_id: matchId, home_score: scoreObj.h, away_score: scoreObj.a }] })
      });

      if (!r || !r.ok) {
        showToast('❌ Error al guardar', true);
        if (btn) { btn.disabled = false; btn.textContent = 'Guardar'; }
        return;
      }

      const result = scoreObj.h > scoreObj.a ? 'HOME' : scoreObj.h < scoreObj.a ? 'AWAY' : 'DRAW';
      myPredictions[matchId] = { match_id: matchId, prediction: result, predicted_home: scoreObj.h, predicted_away: scoreObj.a, is_correct: null, is_exact: null };
      delete pendingPredictions[matchId];
      localStorage.setItem(STORAGE_KEY, JSON.stringify(pendingPredictions));

      updateConfirmBar();
      updateScoreInputBorder(matchId);
      if (btn) { btn.disabled = false; btn.textContent = 'Guardado ✓'; btn.style.background = '#14532d'; btn.style.color = '#86efac'; }
      setTimeout(() => { if (btn) btn.style.display = 'none'; }, 1500);
    }

    function updateScoreInputBorder(matchId) {
      const hInput = document.getElementById(`home-${matchId}`);
      const aInput = document.getElementById(`away-${matchId}`);
      if (!hInput || !aInput) return;
      const pending = pendingPredictions[matchId];
      const saved = myPredictions[matchId];
      const color = pending !== undefined ? '#3b82f6' : (saved ? '#22c55e' : '#334155');
      hInput.style.borderColor = color;
      aInput.style.borderColor = color;
    }

    // ── Modal ──────────────────────────────────────────────────────────────────

    function openConfirmModal() {
      const entries = Object.entries(pendingPredictions);
      if (!entries.length) return;

      document.getElementById('modal-count').textContent = entries.length;

      const html = entries.map(([idStr, scoreObj]) => {
        const mid = parseInt(idStr);
        const m = groupMatches.find(x => x.id === mid);
        if (!m) return '';
        const {h, a} = scoreObj;
        const result = h > a ? 'HOME' : h < a ? 'AWAY' : 'DRAW';
        const cls = result === 'HOME' ? 'pred-btn-home' : result === 'DRAW' ? 'pred-btn-draw' : 'pred-btn-away';
        return `<div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #0f172a;">
          <div>
            <div style="font-size:13px; font-weight:600;">${escHtml(m.home_team)} vs ${escHtml(m.away_team)}</div>
            <div style="font-size:11px; color:#64748b;">${escHtml(fmtStage(m.stage))}</div>
          </div>
          <span class="pred-badge ${cls}" style="flex-shrink:0; margin-left:10px; font-size:15px; padding:4px 14px;">${h} - ${a}</span>
        </div>`;
      }).join('');

      document.getElementById('modal-list').innerHTML = html;
      const modal = document.getElementById('confirm-modal');
      modal.style.display = 'flex';
    }

    function closeConfirmModal() {
      document.getElementById('confirm-modal').style.display = 'none';
    }

    async function confirmAll() {
      const predictions = Object.entries(pendingPredictions).map(([id, scoreObj]) => ({
        match_id: parseInt(id),
        home_score: scoreObj.h,
        away_score: scoreObj.a
      }));
      if (!predictions.length) return;

      const btn = document.getElementById('btn-confirm-all');
      btn.disabled = true;
      btn.textContent = 'Guardando...';

      const r = await api('/api/predictions/batch', {
        method: 'POST',
        body: JSON.stringify({ group_id: groupId, predictions })
      });

      btn.disabled = false;
      btn.textContent = 'Guardar pronósticos';

      if (!r || !r.ok) {
        showToast('❌ Error al guardar', true);
        return;
      }

      const data = await r.json();

      // Mover pendientes a guardados
      Object.entries(pendingPredictions).forEach(([id, scoreObj]) => {
        const result = scoreObj.h > scoreObj.a ? 'HOME' : scoreObj.h < scoreObj.a ? 'AWAY' : 'DRAW';
        myPredictions[parseInt(id)] = {
          match_id: parseInt(id),
          prediction: result,
          predicted_home: scoreObj.h,
          predicted_away: scoreObj.a,
          is_correct: null,
          is_exact: null
        };
      });
      pendingPredictions = {};
      localStorage.removeItem(STORAGE_KEY);

      closeConfirmModal();
      updateConfirmBar();
      renderMatches();

      const msg = data.errors?.length
        ? `✓ ${data.saved} guardados, ${data.errors.length} ya no disponibles`
        : `✓ ${data.saved} pronóstico(s) guardado(s)`;
      showToast(msg);
    }

    function renderGroupPreds(matchId, homeTeam, awayTeam) {
      const preds = groupPredictions[matchId] || groupPredictions[String(matchId)];
      if (!preds || !preds.length) return '';

      const chips = preds.map(p => {
        let label, cls;
        if (p.predicted_home !== null && p.predicted_home !== undefined) {
          label = `${p.predicted_home}-${p.predicted_away}`;
          if (p.is_exact === true) { cls = 'pred-correct'; label += ' ⭐'; }
          else if (p.is_correct === true) cls = 'pred-correct';
          else if (p.is_correct === false) cls = 'pred-wrong';
          else cls = p.prediction === 'HOME' ? 'pred-home' : p.prediction === 'AWAY' ? 'pred-away' : 'pred-draw';
        } else {
          label = predLabel(p.prediction, homeTeam, awayTeam);
          cls = p.is_correct === true ? 'pred-correct' : p.is_correct === false ? 'pred-wrong' : predClass(p.prediction, null);
        }
        const isMe = p.user_id === user.id;
        const nameStyle = isMe ? 'color:#22c55e; font-weight:700;' : 'color:#94a3b8;';
        return `<div style="display:flex; align-items:center; gap:5px; background:#0f172a; border-radius:8px; padding:5px 8px;">
          <span style="font-size:11px; ${nameStyle} white-space:nowrap;">${escHtml(p.username)}</span>
          <span class="pred-badge ${cls}" style="font-size:11px; padding:2px 7px;">${escHtml(label)}</span>
        </div>`;
      }).join('');

      return `<div style="margin-top:10px; border-top:1px solid #1e293b; padding-top:10px;">
        <div style="font-size:11px; color:#475569; margin-bottom:6px; letter-spacing:.5px; text-transform:uppercase;">Pronósticos del grupo</div>
        <div style="display:flex; flex-wrap:wrap; gap:6px;">${chips}</div>
      </div>`;
    }

    // ── Render ─────────────────────────────────────────────────────────────────

    async function loadGroup() {
      const r = await api(`/api/groups/${groupId}`);
      if (!r) return;
      const g = await r.json();
      document.getElementById('group-name').textContent = g.name;
      document.getElementById('group-members-count').textContent = `${g.members.length} miembro${g.members.length !== 1 ? 's' : ''}`;
      inviteCode = g.invite_code;
      document.getElementById('invite-code-display').textContent = g.invite_code;
    }

    async function loadMatches() {
      const [mr, pr, gpr] = await Promise.all([
        api('/api/matches'),
        api(`/api/predictions?group_id=${groupId}`),
        api(`/api/predictions/public?group_id=${groupId}`)
      ]);
      if (!mr || !pr) return;
      groupMatches = await mr.json();
      const preds = await pr.json();
      myPredictions = {};
      preds.forEach(p => { myPredictions[p.match_id] = p; });
      groupPredictions = gpr ? await gpr.json() : {};

      // Limpiar pendientes de partidos que ya empezaron, formato inválido, o dentro de 10 min
      const nowMs = Date.now();
      groupMatches.forEach(m => {
        if (m.status !== 'SCHEDULED' && pendingPredictions[m.id]) {
          delete pendingPredictions[m.id];
          return;
        }
        if (m.status === 'SCHEDULED' && m.match_date && pendingPredictions[m.id]) {
          const matchTs = new Date(m.match_date + (m.match_date.endsWith('Z') ? '' : 'Z')).getTime();
          if ((matchTs - nowMs) / 60000 < 10) delete pendingPredictions[m.id];
        }
      });
      // Limpiar entradas de formato viejo (string)
      Object.keys(pendingPredictions).forEach(id => {
        const v = pendingPredictions[parseInt(id)];
        if (!v || typeof v !== 'object' || !('h' in v)) {
          delete pendingPredictions[parseInt(id)];
        }
      });
      savePendingToStorage();

      buildDayButtons();
      renderMatches();
      updateConfirmBar();
    }

    function flagImg(code, name) {
      if (!code) return `<span style="font-size:18px;">🏴</span>`;
      return `<img src="https://flagcdn.com/w56/${code}.png" alt="${escHtml(name)}" class="flag-img" onerror="this.outerHTML='<span>🏴</span>'">`;
    }

    function renderMatches() {
      const el = document.getElementById('matches-list');
      if (!groupMatches.length) {
        el.innerHTML = `<div style="text-align:center; padding:40px; color:#64748b;"><div style="font-size:40px; margin-bottom:8px;">⏳</div><p>No hay partidos cargados todavía.</p></div>`;
        return;
      }

      const displayMatches = activeDay === null
        ? groupMatches
        : groupMatches.filter(m => getArgDate(m.match_date) === activeDay);

      if (!displayMatches.length) {
        el.innerHTML = `<div style="text-align:center; padding:40px; color:#64748b;"><p>No hay partidos en este día.</p></div>`;
        return;
      }

      const byDay = {};
      const dayOrder = [];
      displayMatches.forEach(m => {
        const day = getArgDate(m.match_date);
        if (!byDay[day]) { byDay[day] = []; dayOrder.push(day); }
        byDay[day].push(m);
      });
      Object.values(byDay).forEach(ms => ms.sort((a, b) => new Date(a.match_date) - new Date(b.match_date)));

      let html = '';
      dayOrder.forEach(day => {
        html += `<div class="stage-header">📅 ${fmtDayHeader(day)}</div>`;
        byDay[day].forEach(m => {
          const pred = myPredictions[m.id];
          const isFinished = m.status === 'FINISHED';
          const isLive = m.status === 'LIVE';
          const matchStarted = isFinished || isLive;
          const nowTs = Date.now();
          const matchTs = m.match_date ? new Date(m.match_date + (m.match_date.endsWith('Z') ? '' : 'Z')).getTime() : Infinity;
          const nearlyStarting = m.status === 'SCHEDULED' && (matchTs - nowTs) / 60000 < 10;
          const canPredict = !isFinished && !nearlyStarting;

          const score = isFinished
            ? `<div style="font-size:18px; font-weight:800; color:#f1f5f9; line-height:1;">${m.home_score} - ${m.away_score}</div>`
            : isLive
            ? `<div style="font-size:18px; font-weight:800; color:#ef4444; line-height:1;">${m.home_score ?? 0} - ${m.away_score ?? 0}</div>`
            : '';

          const statusBadge = isLive
            ? '<span class="status-live">EN VIVO</span>'
            : isFinished ? '<span class="status-finished">Final</span>'
            : nearlyStarting ? '<span class="status-finished" style="background:#78350f; color:#fef3c7; border-radius:4px; padding:2px 6px; font-size:11px; font-weight:700;">🔒 POR EMPEZAR</span>'
            : '';

          const cardBorder = pred?.is_correct === true ? 'border-color:#22c55e;'
            : pred?.is_correct === false ? 'border-color:#ef4444;' : '';

          const hFlagBtn = m.home_flag ? `<img src="https://flagcdn.com/w40/${m.home_flag}.png" style="width:32px;height:21px;border-radius:2px;object-fit:cover;margin-bottom:4px;display:block;margin-left:auto;margin-right:auto;" onerror="this.style.display='none'">` : '';
          const aFlagBtn = m.away_flag ? `<img src="https://flagcdn.com/w40/${m.away_flag}.png" style="width:32px;height:21px;border-radius:2px;object-fit:cover;margin-bottom:4px;display:block;margin-left:auto;margin-right:auto;" onerror="this.style.display='none'">` : '';

          let bottomHtml;
          if (canPredict) {
            const saved = myPredictions[m.id];
            const pending = pendingPredictions[m.id];
            const pendingH = pending !== undefined ? pending.h : (saved?.predicted_home ?? '');
            const pendingA = pending !== undefined ? pending.a : (saved?.predicted_away ?? '');
            const inputBorder = pending !== undefined ? '#3b82f6' : (saved ? '#22c55e' : '#334155');

            bottomHtml = `
              <div id="pred-${m.id}" style="display:flex; align-items:center; justify-content:center; gap:10px; margin-top:14px;">
                <div style="text-align:center; flex:1;">
                  ${hFlagBtn}
                  <div style="font-size:10px; color:#94a3b8; margin:3px 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escHtml(m.home_team)}</div>
                  <input type="number" id="home-${m.id}" min="0" max="20" value="${pendingH}" placeholder="0"
                    oninput="updateScore(${m.id})"
                    style="width:64px; text-align:center; font-size:26px; font-weight:800; background:#0f172a; border:2px solid ${inputBorder}; border-radius:10px; color:#f1f5f9; padding:8px 2px; outline:none;">
                </div>
                <div style="font-size:20px; color:#475569; font-weight:700; padding-top:20px;">-</div>
                <div style="text-align:center; flex:1;">
                  ${aFlagBtn}
                  <div style="font-size:10px; color:#94a3b8; margin:3px 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escHtml(m.away_team)}</div>
                  <input type="number" id="away-${m.id}" min="0" max="20" value="${pendingA}" placeholder="0"
                    oninput="updateScore(${m.id})"
                    style="width:64px; text-align:center; font-size:26px; font-weight:800; background:#0f172a; border:2px solid ${inputBorder}; border-radius:10px; color:#f1f5f9; padding:8px 2px; outline:none;">
                </div>
              </div>
              <button id="save-btn-${m.id}" onclick="saveOne(${m.id})"
                style="display:${pendingPredictions[m.id] !== undefined ? 'block' : 'none'}; width:100%; margin-top:12px; background:#16a34a; color:white; border:none; border-radius:10px; padding:11px; font-size:14px; font-weight:700; cursor:pointer;">
                Guardar pronóstico
              </button>`;
          } else {
            const groupPredsHtml = matchStarted ? renderGroupPreds(m.id, m.home_team, m.away_team) : '';
            const lockMsg = nearlyStarting ? `<div style="font-size:12px; color:#94a3b8; margin-top:6px;">Pronósticos cerrados 10 min antes del inicio</div>` : '';
            bottomHtml = `<div style="margin-top:10px;">${buildPredBadge(pred, m.home_team, m.away_team)}${lockMsg}</div>${groupPredsHtml}`;
          }

          html += `<div class="match-card" style="${cardBorder}">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
              <div>
                <div style="font-size:11px; color:#64748b; text-transform:uppercase; letter-spacing:.5px;">${escHtml(fmtStage(m.stage))}</div>
                <div style="font-size:12px; color:#94a3b8;">${fmtDate(m.match_date)}</div>
              </div>
              ${statusBadge}
            </div>
            <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
              <div style="display:flex; align-items:center; gap:8px; flex:1; min-width:0;">
                ${flagImg(m.home_flag, m.home_team)}
                <span style="font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escHtml(m.home_team)}</span>
              </div>
              <div style="padding:0 8px; text-align:center; min-width:50px; flex-shrink:0;">
                ${score || '<span style="color:#475569; font-size:13px; font-weight:600;">VS</span>'}
              </div>
              <div style="display:flex; align-items:center; gap:8px; flex:1; justify-content:flex-end; min-width:0;">
                <span style="font-weight:700; font-size:14px; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escHtml(m.away_team)}</span>
                ${flagImg(m.away_flag, m.away_team)}
              </div>
            </div>
            ${bottomHtml}
          </div>`;
        });
      });

      el.innerHTML = html;
    }

    // ── Ranking ────────────────────────────────────────────────────────────────

    async function loadRanking() {
      const r = await api(`/api/rankings/${groupId}`);
      if (!r) return;
      const ranking = await r.json();
      const el = document.getElementById('ranking-list');
      if (!ranking.length) {
        el.innerHTML = `<div style="text-align:center; padding:40px; color:#64748b;">Sin datos aún.</div>`;
        return;
      }
      const medals = ['🥇','🥈','🥉'];
      const posCls = ['pos-1','pos-2','pos-3'];
      el.innerHTML = ranking.map((r, i) => {
        const parts = [];
        if (r.base_points > 0 || r.bonus_points > 0) parts.push(`${r.base_points}+${r.bonus_points}⭐ viejo`);
        if (r.result_points > 0) parts.push(`${r.result_points} res`);
        if (r.exact_points > 0) parts.push(`${r.exact_points} exacto`);
        const breakdown = parts.length ? parts.join(' · ') : '—';
        return `
        <div class="rank-row" style="${r.user_id === user.id ? 'border:1px solid #22c55e;' : ''}">
          <div class="rank-pos ${posCls[i] || ''}">${medals[i] || r.position}</div>
          <div style="flex:1;">
            <div style="font-weight:700; ${r.user_id === user.id ? 'color:#22c55e;' : ''}">${escHtml(r.username)} ${r.user_id === user.id ? '(vos)' : ''}</div>
            <div style="font-size:12px; color:#64748b;">${r.predictions_made} pronósticos</div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:22px; font-weight:800;">${r.total_points}</div>
            <div style="font-size:11px; color:#64748b;">${breakdown}</div>
          </div>
        </div>`;
      }).join('');
    }

    // ── Utils ──────────────────────────────────────────────────────────────────

    function switchTab(tab) {
      document.getElementById('content-matches').style.display = tab === 'matches' ? '' : 'none';
      document.getElementById('content-ranking').style.display = tab === 'ranking' ? '' : 'none';
      document.getElementById('tab-matches').className = 'tab-btn' + (tab === 'matches' ? ' active' : '');
      document.getElementById('tab-ranking').className = 'tab-btn' + (tab === 'ranking' ? ' active' : '');
      if (tab === 'ranking') loadRanking();
    }

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.background = isError ? '#dc2626' : '#16a34a';
      t.style.opacity = '1';
      setTimeout(() => { t.style.opacity = '0'; }, 2200);
    }

    function copyCode() {
      navigator.clipboard.writeText(inviteCode).catch(() => {});
      showToast('¡Código copiado!');
    }

    function shareGroup() {
      const url = window.location.origin + '/app';
      const msg = `¡Unite a mi grupo de prode del Mundial 2026! Código: ${inviteCode}\n${url}`;
      if (navigator.share) {
        navigator.share({ title: 'Prode Mundial 2026', text: msg });
      } else {
        navigator.clipboard.writeText(msg).catch(() => {});
        showToast('¡Código copiado!');
      }
    }

    loadGroup();
    loadMatches();
  </script>
</body>
</html>
