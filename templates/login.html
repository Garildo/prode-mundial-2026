<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Prode Mundial 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; }
    .card { background: #1e293b; border-radius: 16px; }
    .input { background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: #e2e8f0; padding: 12px 16px; width: 100%; font-size: 16px; outline: none; transition: border-color .2s; }
    .input:focus { border-color: #22c55e; }
    .btn-green { background: #16a34a; color: white; border-radius: 10px; padding: 14px; width: 100%; font-size: 16px; font-weight: 600; border: none; cursor: pointer; transition: background .2s; }
    .btn-green:hover { background: #15803d; }
    .btn-green:disabled { background: #166534; opacity: .6; cursor: not-allowed; }
    .tab { padding: 10px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all .2s; color: #94a3b8; }
    .tab.active { background: #16a34a; color: white; }
    .error { background: #450a0a; border: 1px solid #dc2626; color: #fca5a5; border-radius: 8px; padding: 12px; font-size: 14px; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div style="width:100%; max-width:400px;">

    <!-- Header -->
    <div class="text-center mb-8">
      <div style="font-size:56px; margin-bottom:8px;">⚽</div>
      <h1 style="font-size:24px; font-weight:800; color:#f1f5f9;">Prode Mundial 2026</h1>
      <p style="color:#64748b; margin-top:4px;">Jugá con tus amigos</p>
    </div>

    <!-- Card -->
    <div class="card p-6">
      <!-- Tabs -->
      <div style="display:flex; background:#0f172a; border-radius:10px; padding:4px; margin-bottom:24px;">
        <button class="tab active" style="flex:1;" id="tab-login" onclick="switchTab('login')">Iniciar Sesión</button>
        <button class="tab" style="flex:1;" id="tab-register" onclick="switchTab('register')">Registrarse</button>
      </div>

      <div id="error-msg" class="error" style="display:none; margin-bottom:16px;"></div>

      <!-- Login Form -->
      <form id="form-login" onsubmit="handleLogin(event)">
        <div style="margin-bottom:16px;">
          <label style="display:block; font-size:14px; color:#94a3b8; margin-bottom:6px;">Email</label>
          <input class="input" type="email" id="login-email" placeholder="tu@email.com" required/>
        </div>
        <div style="margin-bottom:24px;">
          <label style="display:block; font-size:14px; color:#94a3b8; margin-bottom:6px;">Contraseña</label>
          <input class="input" type="password" id="login-pass" placeholder="••••••" required/>
        </div>
        <button class="btn-green" type="submit" id="btn-login">Entrar</button>
      </form>

      <!-- Register Form -->
      <form id="form-register" style="display:none;" onsubmit="handleRegister(event)">
        <div style="margin-bottom:16px;">
          <label style="display:block; font-size:14px; color:#94a3b8; margin-bottom:6px;">Email</label>
          <input class="input" type="email" id="reg-email" placeholder="tu@email.com" required/>
        </div>
        <div style="margin-bottom:16px;">
          <label style="display:block; font-size:14px; color:#94a3b8; margin-bottom:6px;">Nombre de usuario</label>
          <input class="input" type="text" id="reg-user" placeholder="ej: el_messi10" required maxlength="30"/>
        </div>
        <div style="margin-bottom:24px;">
          <label style="display:block; font-size:14px; color:#94a3b8; margin-bottom:6px;">Contraseña</label>
          <input class="input" type="password" id="reg-pass" placeholder="Mínimo 6 caracteres" required minlength="6"/>
        </div>
        <button class="btn-green" type="submit" id="btn-register">Crear cuenta</button>
      </form>
    </div>
  </div>

  <script>
    // Redirect if already logged in
    if (localStorage.getItem('prode_token')) window.location.href = '/app';

    function switchTab(tab) {
      document.getElementById('form-login').style.display = tab === 'login' ? '' : 'none';
      document.getElementById('form-register').style.display = tab === 'register' ? '' : 'none';
      document.getElementById('tab-login').className = 'tab' + (tab === 'login' ? ' active' : '');
      document.getElementById('tab-register').className = 'tab' + (tab === 'register' ? ' active' : '');
      document.getElementById('error-msg').style.display = 'none';
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.style.display = 'block';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      btn.disabled = true; btn.textContent = 'Entrando...';
      document.getElementById('error-msg').style.display = 'none';
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            email: document.getElementById('login-email').value,
            password: document.getElementById('login-pass').value,
          })
        });
        const data = await r.json();
        if (!r.ok) { showError(data.detail || 'Error al iniciar sesión'); return; }
        localStorage.setItem('prode_token', data.token);
        localStorage.setItem('prode_user', JSON.stringify({id: data.id, username: data.username, email: data.email}));
        window.location.href = '/app';
      } catch { showError('Error de conexión'); }
      finally { btn.disabled = false; btn.textContent = 'Entrar'; }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-register');
      btn.disabled = true; btn.textContent = 'Creando cuenta...';
      document.getElementById('error-msg').style.display = 'none';
      try {
        const r = await fetch('/api/auth/register', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            email: document.getElementById('reg-email').value,
            username: document.getElementById('reg-user').value,
            password: document.getElementById('reg-pass').value,
          })
        });
        const data = await r.json();
        if (!r.ok) { showError(data.detail || 'Error al registrarse'); return; }
        localStorage.setItem('prode_token', data.token);
        localStorage.setItem('prode_user', JSON.stringify({id: data.id, username: data.username, email: data.email}));
        window.location.href = '/app';
      } catch { showError('Error de conexión'); }
      finally { btn.disabled = false; btn.textContent = 'Crear cuenta'; }
    }
  </script>
</body>
</html>
